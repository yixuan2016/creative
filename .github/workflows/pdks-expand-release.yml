name: Expand PDKS 0.5.3 source tree

on:
  push:
    branches: [main]
    paths:
      - 'PDKS/releases/PDKS_0.5.3_完整综合工程包.zip'

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Expand complete PDKS source package
        shell: bash
        run: |
          set -euo pipefail
          archive='PDKS/releases/PDKS_0.5.3_完整综合工程包.zip'
          test -s "$archive"
          mkdir -p /tmp/pdks-package
          unzip -q "$archive" -d /tmp/pdks-package
          test -d /tmp/pdks-package/PDKS

          # Merge the complete source tree into the dedicated PDKS directory.
          # Keep the curated repository entrypoint and current release metadata.
          rsync -a \
            --exclude='/README.md' \
            --exclude='/STAGE.md' \
            --exclude='/ROADMAP.md' \
            --exclude='/RELEASE_NOTES*' \
            --exclude='/MANIFEST.json' \
            --exclude='/MANIFEST.sha256' \
            /tmp/pdks-package/PDKS/ PDKS/

      - name: Rebuild manifest and checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path("PDKS")
          excluded = {
              "MANIFEST.json",
              "MANIFEST.sha256",
              "releases/PDKS_0.5.3_完整综合工程包.zip",
          }
          files = []
          for path in sorted(root.rglob("*")):
              if not path.is_file():
                  continue
              rel = path.relative_to(root).as_posix()
              if rel in excluded or path.suffix in {".pyc", ".pyo"}:
                  continue
              if any(part in {"__pycache__", ".pytest_cache", ".mypy_cache", ".venv", "node_modules", "dist", "data", "backup", "raw-captures"} for part in path.parts):
                  continue
              data = path.read_bytes()
              files.append({
                  "path": rel,
                  "size_bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })

          manifest = {
              "package": "PDKS 0.5.3 Node-native Agent Bootstrap Preview",
              "pdks_track": "0.5.3",
              "development_stage": "transitional_skill_development",
              "maturity": "experimental_preview",
              "agent_bridge": "0.2.0",
              "native_bootstrap": "0.2.0",
              "setup_skill": "0.3.0",
              "personal_knowledge_skill": "0.3.4",
              "capture_runtime": "0.1.1_optional_python",
              "file_store_adapter": "0.1.0_one_way_projection_preview",
              "dws_connector": "0.1.0_live_tenant_not_verified",
              "ontology": "0.2.1_frozen",
              "default_initialization": "node_native_file_first_no_python_required",
              "data_collection_enabled_by_default": False,
              "cloud_sync_enabled_by_default": False,
              "encryption_at_rest": False,
              "test_summary": {"total": 162, "passed": 160, "skipped": 2, "failed": 0},
              "stage_validator": {"passed": 12, "total": 12, "status": "valid"},
              "ontology_runtime_term_coverage": {"referenced": 98, "declared": 98, "status": "valid"},
              "files_count": len(files),
              "files": files,
          }
          manifest_path = root / "MANIFEST.json"
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          digest = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          (root / "MANIFEST.sha256").write_text(digest + "  MANIFEST.json\n", encoding="utf-8")
          print(f"Manifest generated for {len(files)} files")
          PY

      - name: Commit expanded source tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PDKS
          if git diff --cached --quiet; then
            echo 'No expanded source changes to commit.'
            exit 0
          fi
          git commit -m 'Expand PDKS 0.5.3 source tree'
          git push origin HEAD:main
