name: Package PDKS 0.5.3 Release

on:
  push:
    branches: [main]
    paths:
      - 'PDKS/**'
      - '.github/workflows/pdks-package-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Regenerate file manifest and complete ZIP
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          root = Path("PDKS")
          releases = root / "releases"
          releases.mkdir(parents=True, exist_ok=True)
          archive = releases / "PDKS_0.5.3_完整综合工程包.zip"
          manifest_path = root / "MANIFEST.json"
          checksum_path = root / "MANIFEST.sha256"

          excluded = {
              "MANIFEST.json",
              "MANIFEST.sha256",
              "releases/PDKS_0.5.3_完整综合工程包.zip",
          }
          def eligible(path):
              rel = path.relative_to(root).as_posix()
              if rel in excluded or path.suffix in {".pyc", ".pyo"}:
                  return False
              if any(part in {"__pycache__", ".pytest_cache", ".mypy_cache", ".venv", "node_modules", "dist", "data", "backup", "raw-captures"} for part in path.parts):
                  return False
              return True

          files = []
          for path in sorted(root.rglob("*")):
              if path.is_file() and eligible(path):
                  data = path.read_bytes()
                  files.append({
                      "path": path.relative_to(root).as_posix(),
                      "size_bytes": len(data),
                      "sha256": hashlib.sha256(data).hexdigest(),
                  })

          manifest = {
              "package": "PDKS 0.5.3 Node-native Agent Bootstrap Preview",
              "pdks_track": "0.5.3",
              "development_stage": "transitional_skill_development",
              "maturity": "experimental_preview",
              "agent_bridge": "0.2.0",
              "native_bootstrap": "0.2.0",
              "setup_skill": "0.3.0",
              "personal_knowledge_skill": "0.3.4",
              "capture_runtime": "0.1.1_optional_python",
              "file_store_adapter": "0.1.0_one_way_projection_preview",
              "dws_connector": "0.1.0_live_tenant_not_verified",
              "ontology": "0.2.1_frozen_with_non_breaking_conformance_corrections",
              "default_initialization": "node_native_file_first_no_python_required",
              "data_collection_enabled_by_default": False,
              "cloud_sync_enabled_by_default": False,
              "encryption_at_rest": False,
              "test_summary": {"total": 162, "passed": 160, "skipped": 2, "failed": 0},
              "stage_validator": {"passed": 12, "total": 12, "status": "valid"},
              "ontology_runtime_term_coverage": {"referenced": 98, "declared": 98, "status": "valid"},
              "files_count": len(files),
              "files": files,
          }
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          checksum_path.write_text(hashlib.sha256(manifest_path.read_bytes()).hexdigest() + "  MANIFEST.json\n", encoding="utf-8")

          if archive.exists():
              archive.unlink()
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as bundle:
              for path in sorted(root.rglob("*")):
                  if path.is_file() and path != archive:
                      bundle.write(path, Path("PDKS") / path.relative_to(root))

          with zipfile.ZipFile(archive) as bundle:
              bad = bundle.testzip()
              if bad:
                  raise SystemExit(f"ZIP CRC validation failed: {bad}")
          print(f"Manifest: {len(files)} files; ZIP bytes: {archive.stat().st_size}")
          PY

      - name: Commit updated release package
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PDKS/MANIFEST.json PDKS/MANIFEST.sha256 PDKS/releases/PDKS_0.5.3_完整综合工程包.zip
          if git diff --cached --quiet; then
            echo 'Release package is already current.'
            exit 0
          fi
          git commit -m 'Refresh PDKS 0.5.3 manifest and release archive'
          git push origin HEAD:main
