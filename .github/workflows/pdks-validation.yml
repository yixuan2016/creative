name: PDKS 0.5.3 Validation

on:
  push:
    branches: [main]
    paths:
      - 'PDKS/**'
      - '.github/workflows/pdks-validation.yml'
  pull_request:
    paths:
      - 'PDKS/**'
      - '.github/workflows/pdks-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-validation:
    name: Python, Ontology and Runtime Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDKS development and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r PDKS/requirements-dev.txt
          python -m pip install -e PDKS/runtime
      - name: Validate transitional stage contract
        working-directory: PDKS
        run: python skills/pdks-personal-knowledge/scripts/validate_skill_stage.py --json
      - name: Run Skill and release tests
        working-directory: PDKS
        run: python -m unittest discover -s tests -v
      - name: Run prototype regression tests
        working-directory: PDKS
        run: python -m unittest discover -s prototype -v
      - name: Run capture runtime tests
        working-directory: PDKS
        run: python -m unittest discover -s runtime/tests -v
      - name: Validate Ontology governance
        working-directory: PDKS
        run: python prototype/pdks_ontology_cli.py ontology-check
      - name: Verify Ontology manifest
        working-directory: PDKS
        run: python skills/pdks-personal-knowledge/scripts/build_ontology_manifest.py --check

  node-validation:
    name: Node-native Bootstrap and MCP Bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install Node dependencies
        working-directory: PDKS/agent-native
        run: npm install --no-audit --no-fund
      - name: Run Node tests
        working-directory: PDKS/agent-native
        run: npm test
      - name: Build MCP Apps
        working-directory: PDKS/agent-native
        run: npm run build
