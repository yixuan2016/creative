name: PDKS Cross-Agent Benchmark CI

on:
  push:
    branches:
      - 'pdks-skill-0.4.3-cross-agent-validation'
  pull_request:
    branches:
      - 'pdks-skill-0.4.3-cross-agent-validation'
  workflow_dispatch:

jobs:
  benchmark-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Validate transitional stage
        run: python skills/pdks-personal-knowledge/scripts/validate_skill_stage.py --json
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate ontology governance
        run: python prototype/pdks_ontology_cli.py ontology-check
      - name: Verify ontology manifest
        run: python skills/pdks-personal-knowledge/scripts/build_ontology_manifest.py --check
