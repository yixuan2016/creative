name: PDKS Personal Capture Runtime CI

on:
  push:
    branches:
      - 'pdks-0.5.1-dws-connector'
      - 'pdks-0.5.1.2-agent-driven-installer'
      - 'main'
  pull_request:
    branches:
      - 'pdks-0.5.1-dws-connector'
      - 'pdks-0.5.1.2-agent-driven-installer'
      - 'main'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDKS development and runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e runtime
      - name: Validate transitional stage
        run: python skills/pdks-personal-knowledge/scripts/validate_skill_stage.py --json
      - name: Run Skill regression tests
        run: python -m unittest discover -s tests -v
      - name: Run ADS / personal runtime regression tests
        run: python -m unittest discover -s prototype -v
      - name: Run Personal Capture Runtime tests
        run: python -m unittest discover -s runtime/tests -v
      - name: Validate Ontology
        run: python prototype/pdks_ontology_cli.py ontology-check
      - name: Verify Ontology manifest
        run: python skills/pdks-personal-knowledge/scripts/build_ontology_manifest.py --check
