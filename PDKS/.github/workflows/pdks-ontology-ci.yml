name: PDKS Ontology CI

on:
  push:
    branches: ["pdks-ontology-0.4.0", "pdks-ontology-0.4.1"]
    paths:
      - "prototype/pdks_ontology_*.py"
      - "skills/pdks-personal-knowledge/assets/**"
      - "skills/pdks-personal-knowledge/scripts/**"
      - "skills/pdks-personal-knowledge/examples/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/pdks-ontology-ci.yml"
  pull_request:
    paths:
      - "prototype/pdks_ontology_*.py"
      - "skills/pdks-personal-knowledge/assets/**"
      - "skills/pdks-personal-knowledge/scripts/**"
      - "skills/pdks-personal-knowledge/examples/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/pdks-ontology-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ontology-quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ontology and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify ontology release manifest
        run: python skills/pdks-personal-knowledge/scripts/build_ontology_manifest.py --check
      - name: Parse ontology modules and run semantic governance checks
        run: python prototype/pdks_ontology_cli.py ontology-check
      - name: Run SHACL validation on all example owner partitions
        run: >-
          python prototype/pdks_ontology_cli.py validate
          --records-dir skills/pdks-personal-knowledge/examples/scenarios
          --strict-refs --shacl
          --trusted-consent-ref urn:pdks:consent:example:daily-work
          --trusted-consent-ref urn:pdks:consent:example:research
          --trusted-consent-ref urn:pdks:consent:example:voice-meeting
      - name: Run unit and release tests
        run: python -m unittest discover -s tests -v
