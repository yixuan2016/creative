openapi: 3.1.0
info:
  title: PDKS Personal Capture Runtime API
  version: 0.1.1
  description: Experimental loopback-only reference API. Not production hardened.
servers:
  - url: http://127.0.0.1:8765
security:
  - BearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Runtime health
      responses:
        '200': {description: Runtime status}
  /v1/captures:
    get:
      summary: List current owner's captures
      responses:
        '200': {description: Capture list}
  /v1/captures/text:
    post:
      summary: Capture user-supplied text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: {type: string}
                source_kind: {type: string, default: manual}
                origin_system: {type: string}
                source_locator: {type: string}
                domain: {type: string, default: other}
                sensitivity: {type: string, default: personal_private}
                capture_method: {type: string, default: manual_upload}
                consent_ref: {type: string}
                occurred_at: {type: string}
                idempotency_key: {type: string}
      responses:
        '201': {description: Capture accepted}
        '403': {description: Authorization or consent denied}
  /v1/captures/file:
    post:
      summary: Upload a file as base64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_base64]
              properties:
                filename: {type: string}
                content_base64: {type: string}
                source_kind: {type: string}
                domain: {type: string}
                sensitivity: {type: string}
                capture_method: {type: string}
                consent_ref: {type: string}
      responses:
        '201': {description: File captured}
  /v1/captures/{capture_id}:
    get:
      summary: Read capture metadata and extracted text
      parameters:
        - {name: capture_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Capture details}
  /v1/records/propose:
    post:
      summary: Submit candidate PDKS records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records, source_ids]
              properties:
                records: {type: array, items: {type: object}}
                source_ids: {type: array, items: {type: string}}
      responses:
        '201': {description: Candidate records queued for owner review}
  /v1/records:
    get:
      summary: List records
      parameters:
        - {name: review_state, in: query, schema: {type: string, default: accepted}}
      responses:
        '200': {description: Records list}
  /v1/records/{record_id}:
    get:
      summary: Read one record within the authenticated owner partition
      parameters:
        - {name: record_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Record body and review state}
  /v1/records/{record_id}/approve:
    post:
      summary: Owner approves one candidate record
      parameters:
        - {name: record_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Approved}
  /v1/consents:
    post:
      summary: Create an explicit consent grant
      responses:
        '201': {description: Consent created}
  /v1/consents/{consent_ref}/revoke:
    post:
      summary: Revoke a consent grant; existing data is not automatically deleted
      parameters:
        - {name: consent_ref, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Revoked}
  /v1/sources/{source_id}:
    delete:
      summary: Purge local source and dependent record bodies
      parameters:
        - {name: source_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Local purge receipt; external backups are outside scope}
  /v1/export:
    post:
      summary: Export a PDKS bundle
      responses:
        '200': {description: Export receipt}
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-token
